[package]
name = "media-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "media_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 同上：必须在 build 依赖图里也把 `std` 打开。
#
# edition 2021 默认用 resolver v2，**build-dependencies 与 dependencies 的特性
# 不再互相统一**——只在 `[dependencies]` 里写这条，编译 tauri-build 那一侧时
# indexmap 仍然是「无 std」的那份，`has_std` 依旧不发射。两侧都要写才干净。
indexmap = { version = "1.9.3", features = ["std"] }

[features]
# 开启后前端资源会被**嵌入到二进制**里，应用可脱离 vite dev server 独立运行。
#
# 背景：tauri 的 build.rs 里是 `dev = !has_feature("custom-protocol")`，
# 不开这个 feature 就判定为 dev 模式，webview 会去连 tauri.conf.json 的 devUrl
# （http://localhost:1420）；若此时没有 dev server，窗口只会显示
# 「无法访问此页面 / ERR_CONNECTION_REFUSED」。
#
# 因此：start.bat / verify.bat 一律带 `--features custom-protocol` 构建。
# 需要热重载开发时改用 `npm run tauri dev`（走 devUrl，不带该 feature）。
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# 只保留行号级别的调试信息（默认 debug=2 会把完整 DWARF 写进每个 .rlib/.exe）。
#
# 原因：默认设置下 target/ 实测约 4.5 GB，几乎全是调试信息；
# debug=1 只留函数名与行号——panic 时仍能看到出错位置，日常排障够用，
# 体积则大幅下降。需要完整调试信息时临时注释掉这两行或改用 `debug = 2`。
debug = 1

# 关闭增量编译。
#
# 原因：本机增量缓存多次损坏（日志里反复出现
# `error copying object file ... metadata.rmeta / error deleting lock file ... os error 5`），
# 并在反复切换 feature（custom-protocol）后导致 rustc 在 rmeta 编码阶段直接 ICE：
# `rustc_metadata/src/rmeta/encoder.rs: no entry found for key`。
# 这类缓存损坏会让 rustc 读取到陈旧的 query 结果而崩溃。
# 本项目体量不大，关闭增量后完整编译依然很快（秒级），还能显著减小 target/ 体积。
# 修复/恢复手段始终是：`cargo clean` 后重新构建。
incremental = false

[profile.release]
# 去掉符号表 / 调试信息，让发布用的 exe 明显变小。
#
# 发版产物是给用户双击运行的成品，现场排障不需要它的符号；
# panic 的位置由 `main.rs` 的错误信息与日志给出，够定位。
# 需要带符号排查线上问题时，临时改成 `strip = false` 或 `= "debug"` 重新构建即可。
strip = true

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"
regex = "1.13.1"
ureq = { version = "2", features = ["json"] }
tauri-plugin-dialog = "2.7.3"

# 构建可复现性补丁：显式打开 indexmap 1.x 的 `std` 开关。
#
# 背景：indexmap 1.9.3 **没有默认特性**，它的 build.rs 靠 autocfg 现场编译一个
# `extern crate std;` 的探测程序来决定要不要发射 cfg(has_std)。探测一旦失败，
# autocfg 会静默降级（只在 stderr 留一行 "could not probe for `std`"），
# 于是 `IndexMap` 的第三个泛型参数拿不到默认值，下游 schemars 0.8.22 的
# `type Map<K, V> = indexmap::IndexMap<K, V>` 立刻报
# `E0107: struct takes 3 generic arguments but 2 were supplied`，
# **干净重建（cargo clean 后 / 新克隆的机器）会直接失败**，依赖缓存才能编过。
#
# 打开 `std` 之后，build.rs 会走 `CARGO_FEATURE_STD` 分支直接发射 has_std，
# 不再依赖那个脆弱的运行时探测——这也是本项目要「可被别人 clone 后构建」的前提。
indexmap = { version = "1.9.3", features = ["std"] }
