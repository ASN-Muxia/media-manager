[package]
name = "media-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "media_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 开启后前端资源会被**嵌入到二进制**里，应用可脱离 vite dev server 独立运行。
#
# 背景：tauri 的 build.rs 里是 `dev = !has_feature("custom-protocol")`，
# 不开这个 feature 就判定为 dev 模式，webview 会去连 tauri.conf.json 的 devUrl
# （http://localhost:1420）；若此时没有 dev server，窗口只会显示
# 「无法访问此页面 / ERR_CONNECTION_REFUSED」。
#
# 因此：start.bat / verify.bat 一律带 `--features custom-protocol` 构建。
# 需要热重载开发时改用 `npm run tauri dev`（走 devUrl，不带该 feature）。
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# 只保留行号级别的调试信息（默认 debug=2 会把完整 DWARF 写进每个 .rlib/.exe）。
#
# 原因：默认设置下 target/ 实测约 4.5 GB，几乎全是调试信息；
# debug=1 只留函数名与行号——panic 时仍能看到出错位置，日常排障够用，
# 体积则大幅下降。需要完整调试信息时临时注释掉这两行或改用 `debug = 2`。
debug = 1

# 关闭增量编译。
#
# 原因：本机增量缓存多次损坏（日志里反复出现
# `error copying object file ... metadata.rmeta / error deleting lock file ... os error 5`），
# 并在反复切换 feature（custom-protocol）后导致 rustc 在 rmeta 编码阶段直接 ICE：
# `rustc_metadata/src/rmeta/encoder.rs: no entry found for key`。
# 这类缓存损坏会让 rustc 读取到陈旧的 query 结果而崩溃。
# 本项目体量不大，关闭增量后完整编译依然很快（秒级），还能显著减小 target/ 体积。
# 修复/恢复手段始终是：`cargo clean` 后重新构建。
incremental = false

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"
regex = "1.13.1"
ureq = { version = "2", features = ["json"] }
tauri-plugin-dialog = "2.7.3"
