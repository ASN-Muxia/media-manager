[package]
name = "media-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "media_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 开启后前端资源会被**嵌入到二进制**里，应用可脱离 vite dev server 独立运行。
#
# 背景：tauri 的 build.rs 里是 `dev = !has_feature("custom-protocol")`，
# 不开这个 feature 就判定为 dev 模式，webview 会去连 tauri.conf.json 的 devUrl
# （http://localhost:1420）；若此时没有 dev server，窗口只会显示
# 「无法访问此页面 / ERR_CONNECTION_REFUSED」。
#
# 因此：start.bat / verify.bat 一律带 `--features custom-protocol` 构建。
# 需要热重载开发时改用 `npm run tauri dev`（走 devUrl，不带该 feature）。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"
regex = "1.13.1"
ureq = { version = "2", features = ["json"] }
tauri-plugin-dialog = "2.7.3"
